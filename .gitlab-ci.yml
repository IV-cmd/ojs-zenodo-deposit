# Mirrors .github/workflows/ci.yml for GitLab (e.g. CERN's GitLab). Same
# entrypoints — composer/make targets and cypress/setup-env.sh — not a second
# implementation. GitHub Actions is the primary CI.

stages:
  - lint
  - test
  - e2e
  - package

lint:
  stage: lint
  image: php:8.3-cli
  before_script:
    - apt-get update -qq && apt-get install -y -qq unzip git
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - composer install --no-interaction --prefer-dist
  script:
    - composer lint
    - composer analyse

test:
  stage: test
  image: php:${PHP_VERSION}-cli
  parallel:
    matrix:
      - PHP_VERSION: ["8.2", "8.3"]
  before_script:
    - apt-get update -qq && apt-get install -y -qq unzip git
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - composer install --no-interaction --prefer-dist
  script:
    - composer test

# Requires a runner with docker-compose (docker:dind service).
e2e:
  stage: e2e
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - apk add --no-cache docker-compose nodejs npm
    - ./cypress/setup-env.sh
    - cd cypress && npm ci
  script:
    - npx cypress run --browser electron
  artifacts:
    when: on_failure
    paths:
      - cypress/cypress/screenshots/

package:
  stage: package
  image: alpine/helm:3.17.3
  script:
    - helm lint deploy/helm/ojs-zenodo --set secrets.mysqlPassword=ci-check
    - helm template ci deploy/helm/ojs-zenodo --set secrets.mysqlPassword=ci-check > /dev/null
