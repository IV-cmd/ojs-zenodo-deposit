name: CI

on:
  push:
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ["8.2", "8.3"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Run PHPCS
        run: composer lint
      - name: Run PHPStan
        run: composer analyse
      - name: Run PHPUnit
        run: composer test

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - name: Lint and render the Helm chart
        run: |
          helm lint deploy/helm/ojs-zenodo --set secrets.mysqlPassword=ci-check
          helm template ci deploy/helm/ojs-zenodo --set secrets.mysqlPassword=ci-check > /dev/null

  cypress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Boot and seed the OJS dev stack
        run: ./cypress/setup-env.sh
      - uses: cypress-io/github-action@v6
        with:
          working-directory: cypress
          install: npm ci
          run: npx cypress run --browser electron
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/cypress/screenshots
          if-no-files-found: ignore
