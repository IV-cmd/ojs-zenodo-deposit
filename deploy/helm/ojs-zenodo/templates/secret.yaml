{{- if .Values.secrets.create -}}
# Template only — no real credentials. Populate via --set / --set-file or an
# external secrets operator. Keys consumed by the deployments:
#   mysql-password, zenodo-token
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ojs-zenodo.name" . }}
  labels:
    {{- include "ojs-zenodo.labels" . | nindent 4 }}
type: Opaque
stringData:
  mysql-password: {{ required "secrets.mysqlPassword is required" .Values.secrets.mysqlPassword | quote }}
  zenodo-token: {{ .Values.secrets.zenodoToken | quote }}
{{- end -}}
