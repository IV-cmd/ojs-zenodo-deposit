apiVersion: v1
kind: Service
metadata:
  name: {{ include "ojs-zenodo.name" . }}
  labels:
    {{- include "ojs-zenodo.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  ports:
    - port: {{ .Values.ojs.service.port }}
      targetPort: {{ .Values.ojs.service.targetPort }}
  selector:
    app.kubernetes.io/name: {{ include "ojs-zenodo.name" . }}
    app.kubernetes.io/component: web
